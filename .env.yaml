# .env.yaml (TEMPLATE - ne stavljaj stvarne tajne ovdje!)
# Ovdje stavi samo neosjetljive konfiguracijske vrijednosti
# Tajne stavi u GitHub Secrets ili GCP Secret Manager

# GCP Configuration
gcp_project_id: "norse-geode-477321-v2"  # Ovo će biti override-an GitHub secretom
region: "europe-west1"

# Pub/Sub Configuration
pubsub_topic: "reddit-topic"
pubsub_subscription: "reddit-subscription"
dead_letter_topic: "reddit-dead-letter"

# Schema Registry
avro_schema_name: "reddit-schema"

# GCS Configuration
gcs_bucket: "gcs-reddit-data"
gcs_base_path: "reddit-data"

# BigQuery Configuration
bq_dataset: "reddit_pipeline"
bq_table: "reddit_messages"

# Reddit API (OVO IDE U SECRET MANAGER!)
reddit_client_id: "YOUR_CLIENT_ID"      # ← Ovo u Secret Manager
reddit_client_secret: "YOUR_SECRET"     # ← Ovo u Secret Manager
reddit_user_agent: "python:reddit-pipeline:v1.0"

# Application Settings
log_level: "INFO"
batch_size: 100
max_retries: 3

#test